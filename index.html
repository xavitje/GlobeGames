<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlobeGames</title>
    <meta name="description" content="Vier geografie-spellen op één site: GeoHunt, Vorm Raden, GlobeGuess en GeoGuesser." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>" />
    <!-- Warms up the connection to Google's Street View/Maps hosts so the
         first panorama in GeoGuesser has less handshake time to wait for. -->
    <link rel="preconnect" href="https://maps.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://maps.google.com" crossorigin />
    <link rel="preconnect" href="https://streetviewpixels-pa.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />
    <link rel="dns-prefetch" href="https://maps.google.com" />
    <link rel="dns-prefetch" href="https://streetviewpixels-pa.googleapis.com" />
    <!-- Google AdSense: site-verificatie + advertentiescript. Geldt voor de
         hele single-page app, want alle "pagina's" draaien via dit ene
         index.html. -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9333149556787565"
     crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
